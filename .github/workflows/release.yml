name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        run: make frontend-build FRONTEND_USE_CI=1

      - name: Ensure branding icon (optional)
        run: |
          if [ ! -f assets/logo.ico ]; then
            echo "No assets/logo.ico — Windows builds will omit embedded icon."
          fi

      - name: Regenerate Swagger
        working-directory: backend
        run: make swag-init

      - name: Resolve build version
        id: build_version
        run: |
          VERSION_TAG=$(git tag --list --sort=-version:refname | head -n 1)

          if [ -z "$VERSION_TAG" ]; then
            VERSION_TAG="v0.0.0"
          fi

          VERSION_VALUE=${VERSION_TAG#v}
          echo "version=$VERSION_VALUE" >> "$GITHUB_OUTPUT"

      - name: Cross-compile binaries
        working-directory: backend
        env:
          VERSION: ${{ steps.build_version.outputs.version }}
        run: make build-all

      - name: Cross-compile CLI binaries
        working-directory: cli
        env:
          VERSION: ${{ steps.build_version.outputs.version }}
        run: make build-all

      - name: Prepare release assets
        run: |
          cp bin/server/linux-amd64/skyport-server bin/skyport-server-linux-amd64
          cp bin/server/linux-arm64/skyport-server bin/skyport-server-linux-arm64
          cp bin/server/darwin-amd64/skyport-server bin/skyport-server-darwin-amd64
          cp bin/server/darwin-arm64/skyport-server bin/skyport-server-darwin-arm64
          cp bin/server/windows-amd64/skyport-server.exe bin/skyport-server-windows-amd64.exe
          cp bin/cli/linux-amd64/skyport bin/skyport-linux-amd64
          cp bin/cli/linux-arm64/skyport bin/skyport-linux-arm64
          cp bin/cli/darwin-amd64/skyport bin/skyport-darwin-amd64
          cp bin/cli/darwin-arm64/skyport bin/skyport-darwin-arm64
          cp bin/cli/windows-amd64/skyport.exe bin/skyport-windows-amd64.exe

      - name: Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
      - name: Semantic Release (dry-run debug)
        if: ${{ always() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release --no-ci --dry-run --debug || true