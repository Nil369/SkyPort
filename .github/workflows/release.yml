name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        run: make frontend-build FRONTEND_USE_CI=1

      - name: Regenerate Swagger
        working-directory: backend
        run: make swag-init

      - name: Cross-compile binaries
        working-directory: backend
        env:
          VERSION: latest
        run: make build-all

      - name: Prepare release assets
        run: |
          cp bin/linux-amd64/skyport bin/skyport-linux-amd64
          cp bin/linux-arm64/skyport bin/skyport-linux-arm64
          cp bin/darwin-amd64/skyport bin/skyport-darwin-amd64
          cp bin/darwin-arm64/skyport bin/skyport-darwin-arm64
          cp bin/windows-amd64/skyport.exe bin/skyport-windows-amd64.exe

      - name: Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bin/skyport-linux-amd64
            bin/skyport-linux-arm64
            bin/skyport-darwin-amd64
            bin/skyport-darwin-arm64
            bin/skyport-windows-amd64.exe