basePath: /
definitions:
  internal_auth.AuthResponse:
    properties:
      access_token:
        type: string
      expires_at:
        type: string
      refresh_token:
        description: Future-ready placeholder; currently not issued.
        type: string
      token_type:
        type: string
      user:
        $ref: '#/definitions/internal_auth.UserDTO'
    type: object
  internal_auth.CredentialsDTO:
    properties:
      git_auth_type:
        type: string
      has_pat:
        type: boolean
      has_ssh_key:
        type: boolean
    type: object
  internal_auth.LoginRequest:
    properties:
      email:
        maxLength: 255
        type: string
      password:
        maxLength: 128
        minLength: 8
        type: string
    required:
    - email
    - password
    type: object
  internal_auth.RegisterRequest:
    properties:
      email:
        maxLength: 255
        type: string
      name:
        maxLength: 120
        minLength: 2
        type: string
      password:
        maxLength: 128
        minLength: 8
        type: string
      role:
        enum:
        - owner
        - admin
        - developer
        - viewer
        type: string
    required:
    - email
    - name
    - password
    type: object
  internal_auth.UpdateCredentialsRequest:
    properties:
      clear_pat:
        type: boolean
      clear_ssh_key:
        type: boolean
      git_auth_type:
        enum:
        - ssh
        - pat
        type: string
      git_pat:
        maxLength: 4096
        type: string
      git_ssh_key:
        maxLength: 4096
        type: string
    type: object
  internal_auth.UserDTO:
    properties:
      avatar_relative_path:
        type: string
      email:
        type: string
      enabled:
        type: boolean
      id:
        type: integer
      name:
        type: string
      permissions:
        items:
          type: string
        type: array
      roles:
        items:
          type: string
        type: array
    type: object
  internal_capabilities.Snapshot:
    properties:
      architecture:
        type: string
      cpu_cores:
        type: integer
      docker_available:
        description: docker CLI installed
        type: boolean
      docker_daemon_running:
        description: docker engine reachable
        type: boolean
      free_ram_bytes:
        type: integer
      recommendation:
        type: string
      recommendation_notes:
        type: string
      swap_total_bytes:
        type: integer
      total_ram_bytes:
        type: integer
      virtualization:
        type: string
    type: object
  internal_deployments.BulkEnvRequest:
    properties:
      env_text:
        type: string
      items:
        items:
          $ref: '#/definitions/internal_deployments.bulkEnvPair'
        type: array
    type: object
  internal_deployments.CreateDeploymentRequest:
    properties:
      auto_start:
        type: boolean
      build_cmd:
        maxLength: 1024
        type: string
      container_image:
        maxLength: 255
        type: string
      container_password:
        maxLength: 255
        type: string
      container_push:
        type: boolean
      container_registry:
        maxLength: 255
        type: string
      container_tag:
        maxLength: 128
        type: string
      container_username:
        maxLength: 255
        type: string
      env:
        additionalProperties:
          type: string
        type: object
      install_cmd:
        maxLength: 1024
        type: string
      port:
        maximum: 65535
        minimum: 1
        type: integer
      project_id:
        type: integer
      start_cmd:
        maxLength: 1024
        type: string
      strategy:
        enum:
        - docker
        - pm2
        - native
        type: string
      working_directory:
        maxLength: 512
        type: string
    required:
    - project_id
    type: object
  internal_deployments.EnvVarRequest:
    properties:
      key:
        type: string
      masked:
        type: boolean
      value:
        type: string
    type: object
  internal_deployments.bulkEnvPair:
    properties:
      key:
        type: string
      masked:
        type: boolean
      value:
        type: string
    type: object
  internal_deployments.rolloutRequest:
    properties:
      mode:
        enum:
        - reload
        - restart
        type: string
    type: object
  internal_docker.commitRequest:
    properties:
      repository:
        maxLength: 255
        type: string
      tag:
        maxLength: 128
        type: string
    required:
    - repository
    type: object
  internal_docker.daemonRequest:
    properties:
      action:
        enum:
        - start
        - stop
        - restart
        type: string
    required:
    - action
    type: object
  internal_docker.imageRunRequest:
    properties:
      name:
        maxLength: 128
        type: string
      port:
        maximum: 65535
        minimum: 1
        type: integer
    type: object
  internal_filesystem.createFileRequest:
    properties:
      content:
        maxLength: 50000000
        type: string
      filename:
        maxLength: 255
        type: string
      path:
        maxLength: 2048
        type: string
      title:
        maxLength: 255
        type: string
    required:
    - path
    type: object
  internal_filesystem.createFolderRequest:
    properties:
      path:
        maxLength: 2048
        type: string
    required:
    - path
    type: object
  internal_filesystem.readFileRequest:
    properties:
      path:
        maxLength: 2048
        type: string
    required:
    - path
    type: object
  internal_filesystem.renameRequest:
    properties:
      new_path:
        maxLength: 2048
        type: string
      old_path:
        maxLength: 2048
        type: string
    required:
    - new_path
    - old_path
    type: object
  internal_filesystem.writeFileRequest:
    properties:
      content:
        maxLength: 50000000
        type: string
      encoding:
        enum:
        - utf8
        - base64
        type: string
      filename:
        maxLength: 255
        type: string
      path:
        maxLength: 2048
        type: string
      title:
        maxLength: 255
        type: string
    required:
    - content
    - path
    type: object
  internal_orchestrator.convertComposeRequest:
    properties:
      compose_path:
        maxLength: 2048
        type: string
      dry_run:
        type: boolean
      execute:
        type: boolean
      output_path:
        maxLength: 2048
        type: string
      project_path:
        maxLength: 2048
        type: string
    required:
    - project_path
    type: object
  internal_orchestrator.deployRequest:
    properties:
      compose_path:
        maxLength: 2048
        type: string
      dry_run:
        type: boolean
      execute:
        type: boolean
      kube_context:
        maxLength: 200
        type: string
      manifest_path:
        maxLength: 2048
        type: string
      namespace:
        maxLength: 120
        type: string
      project_path:
        maxLength: 2048
        type: string
      stack_name:
        maxLength: 120
        type: string
      type:
        enum:
        - swarm
        - k8s
        type: string
    required:
    - project_path
    - type
    type: object
  internal_orchestrator.generateK8sRequest:
    properties:
      app_name:
        maxLength: 120
        type: string
      env:
        additionalProperties:
          type: string
        type: object
      health_port:
        maximum: 65535
        minimum: 1
        type: integer
      image:
        maxLength: 255
        type: string
      liveness_path:
        maxLength: 255
        type: string
      max_surge:
        maxLength: 20
        type: string
      max_unavailable:
        maxLength: 20
        type: string
      namespace:
        maxLength: 120
        type: string
      port:
        maximum: 65535
        minimum: 1
        type: integer
      project_path:
        maxLength: 2048
        type: string
      readiness_path:
        maxLength: 255
        type: string
      replicas:
        maximum: 50
        minimum: 1
        type: integer
      runtime:
        enum:
        - node
        - python
        type: string
    required:
    - image
    - port
    - project_path
    - runtime
    type: object
  internal_orchestrator.healthRequest:
    properties:
      dry_run:
        type: boolean
      execute:
        type: boolean
      namespace:
        maxLength: 120
        type: string
      selector:
        maxLength: 200
        type: string
      stack_name:
        maxLength: 120
        type: string
      type:
        enum:
        - swarm
        - k8s
        type: string
    required:
    - type
    type: object
  internal_orchestrator.k8sInstallRequest:
    properties:
      dry_run:
        type: boolean
      execute:
        type: boolean
    type: object
  internal_orchestrator.statusResponse:
    properties:
      docker_available:
        type: boolean
      kube_context:
        type: string
      kubectl_available:
        type: boolean
      swarm_active:
        type: boolean
    type: object
  internal_projects.createProjectRequest:
    properties:
      git_auth_type:
        enum:
        - ssh
        - pat
        type: string
      git_branch:
        maxLength: 255
        type: string
      git_pat:
        type: string
      git_ssh_key:
        type: string
      git_url:
        maxLength: 1024
        type: string
      name:
        maxLength: 120
        minLength: 2
        type: string
      private:
        type: boolean
    required:
    - name
    type: object
  internal_proxy.certbotRequest:
    properties:
      domain:
        maxLength: 255
        type: string
      dry_run:
        type: boolean
      email:
        maxLength: 255
        type: string
      execute:
        type: boolean
    required:
    - domain
    - email
    type: object
  internal_proxy.generateRequest:
    properties:
      cert_path:
        maxLength: 1024
        type: string
      domain:
        maxLength: 255
        type: string
      email:
        maxLength: 255
        type: string
      enable_ssl:
        type: boolean
      execute:
        type: boolean
      key_path:
        maxLength: 1024
        type: string
      port:
        maximum: 65535
        minimum: 1
        type: integer
      project_id:
        type: integer
      reload:
        type: boolean
      type:
        enum:
        - caddy
        - nginx
        type: string
    required:
    - domain
    - port
    type: object
  internal_proxy.mappingRequest:
    properties:
      domain:
        maxLength: 255
        type: string
      email:
        maxLength: 255
        type: string
      enable_ssl:
        type: boolean
      port:
        maximum: 65535
        minimum: 1
        type: integer
      project_id:
        type: integer
      type:
        enum:
        - caddy
        - nginx
        type: string
    required:
    - domain
    - port
    type: object
  internal_runtime.Component:
    properties:
      evidence:
        type: string
      kind:
        $ref: '#/definitions/internal_runtime.Kind'
      working_directory:
        type: string
    type: object
  internal_runtime.DetectionResult:
    properties:
      build_command:
        type: string
      components:
        items:
          $ref: '#/definitions/internal_runtime.Component'
        type: array
      confidence:
        type: string
      install_command:
        type: string
      matched_files:
        items:
          type: string
        type: array
      notes:
        type: string
      runtime:
        $ref: '#/definitions/internal_runtime.Kind'
      start_command:
        type: string
      working_directory:
        type: string
    type: object
  internal_runtime.Kind:
    enum:
    - unknown
    - node
    - bun
    - python
    - go
    - php
    - java
    - rust
    - dockerfile
    - compose
    type: string
    x-enum-varnames:
    - Unknown
    - Node
    - Bun
    - Python
    - Go
    - PHP
    - Java
    - Rust
    - Docker
    - Compose
  internal_runtime.detectRequest:
    properties:
      project_path:
        maxLength: 2048
        type: string
    required:
    - project_path
    type: object
  internal_runtime.installRequest:
    properties:
      dry_run:
        type: boolean
      execute:
        type: boolean
      runtime:
        enum:
        - node
        - bun
        - python
        - go
        - php
        - java
        - pm2
        type: string
    required:
    - runtime
    type: object
  internal_runtime.pm2StartupRequest:
    properties:
      dry_run:
        type: boolean
      execute:
        type: boolean
      home:
        maxLength: 2048
        type: string
      user:
        maxLength: 120
        type: string
    type: object
  internal_runtime.smartInstallRequest:
    properties:
      dry_run:
        type: boolean
      execute:
        type: boolean
      project_path:
        maxLength: 2048
        type: string
    required:
    - project_path
    type: object
  internal_system.gitInstallRequest:
    properties:
      execute:
        type: boolean
    type: object
  skyport_internal_models.Deployment:
    properties:
      createdAt:
        type: string
      deletedAt:
        type: string
      error:
        type: string
      id:
        type: integer
      logPath:
        type: string
      path:
        type: string
      port:
        type: integer
      projectID:
        type: integer
      runtime:
        type: string
      status:
        type: string
      strategy:
        type: string
      updatedAt:
        type: string
    type: object
  skyport_internal_models.DomainMapping:
    properties:
      createdAt:
        type: string
      deletedAt:
        type: string
      domain:
        type: string
      email:
        type: string
      enable_ssl:
        type: boolean
      id:
        type: integer
      port:
        type: integer
      project_id:
        type: integer
      type:
        description: caddy | nginx
        type: string
      updatedAt:
        type: string
    type: object
  skyport_internal_models.Project:
    properties:
      createdAt:
        type: string
      deletedAt:
        type: string
      gitURL:
        type: string
      id:
        type: integer
      name:
        type: string
      path:
        type: string
      private:
        type: boolean
      updatedAt:
        type: string
    type: object
  skyport_internal_response.APIError:
    properties:
      code:
        type: string
      details: {}
      message:
        type: string
      request_id:
        type: string
    type: object
  skyport_internal_response.ErrorBody:
    properties:
      error:
        $ref: '#/definitions/skyport_internal_response.APIError'
    type: object
host: localhost
info:
  contact:
    name: Akash Halder
    url: https://github.com/Nil369
  description: Lightweight self-hosted developer cloud platform API
  license:
    name: AGPL-3.0
    url: https://www.gnu.org/licenses/agpl-3.0.en.html
  title: SkyPort API
  version: 0.0.1
paths:
  /api:
    get:
      description: Service metadata and doc link
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: API root
      tags:
      - Root
  /api/v1/auth/credentials:
    get:
      description: Returns stored git credentials metadata
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_auth.CredentialsDTO'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/skyport_internal_response.ErrorBody'
      security:
      - BearerAuth: []
      summary: Git credentials
      tags:
      - Auth
    post:
      consumes:
      - application/json
      description: Stores git credentials for reuse on private repos
      parameters:
      - description: Credentials payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_auth.UpdateCredentialsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_auth.CredentialsDTO'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/skyport_internal_response.ErrorBody'
      security:
      - BearerAuth: []
      summary: Update git credentials
      tags:
      - Auth
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate user and return JWT access token
      parameters:
      - description: Login payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_auth.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/skyport_internal_response.ErrorBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/skyport_internal_response.ErrorBody'
      summary: Login
      tags:
      - Auth
  /api/v1/auth/logout:
    post:
      description: Logout and revoke current token
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/skyport_internal_response.ErrorBody'
      security:
      - BearerAuth: []
      summary: Logout
      tags:
      - Auth
  /api/v1/auth/me:
    get:
      description: Returns details about the authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_auth.UserDTO'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/skyport_internal_response.ErrorBody'
      security:
      - BearerAuth: []
      summary: Current user
      tags:
      - Auth
  /api/v1/auth/register:
    post:
      consumes:
      - application/json
      description: Register a new user account
      parameters:
      - description: Registration payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_auth.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_auth.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/skyport_internal_response.ErrorBody'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/skyport_internal_response.ErrorBody'
      summary: Register user
      tags:
      - Auth
  /api/v1/deployments:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/skyport_internal_models.Deployment'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/skyport_internal_response.ErrorBody'
      security:
      - BearerAuth: []
      summary: List deployments
      tags:
      - Deployments
    post:
      consumes:
      - application/json
      description: 'Creates a deployment. working_directory is ONLY a subfolder INSIDE
        the cloned repo (examples: server, client). Do not pass SKYPORT workspace
        paths—the server joins it onto project.path. Omit for auto-detection. Field
        runtime in JSON is ignored; detection runs locally. Responses include prefetch
        runtime/strategy; poll GET for live status during auto_start.'
      parameters:
      - description: Deployment payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_deployments.CreateDeploymentRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/skyport_internal_models.Deployment'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/skyport_internal_response.ErrorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/skyport_internal_response.ErrorBody'
      security:
      - BearerAuth: []
      summary: Create deployment
      tags:
      - Deployments
  /api/v1/deployments/{id}:
    delete:
      parameters:
      - description: Deployment ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/skyport_internal_response.ErrorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/skyport_internal_response.ErrorBody'
      security:
      - BearerAuth: []
      summary: Delete deployment
      tags:
      - Deployments
    get:
      parameters:
      - description: Deployment ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/skyport_internal_models.Deployment'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/skyport_internal_response.ErrorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/skyport_internal_response.ErrorBody'
      security:
      - BearerAuth: []
      summary: Get deployment
      tags:
      - Deployments
  /api/v1/deployments/{id}/env:
    get:
      parameters:
      - description: Deployment ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              type: object
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/skyport_internal_response.ErrorBody'
      security:
      - BearerAuth: []
      summary: List deployment environment variables
      tags:
      - Deployments
    post:
      consumes:
      - application/json
      parameters:
      - description: Deployment ID
        in: path
        name: id
        required: true
        type: string
      - description: Env payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_deployments.EnvVarRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/skyport_internal_response.ErrorBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/skyport_internal_response.ErrorBody'
      security:
      - BearerAuth: []
      summary: Add deployment environment variable
      tags:
      - Deployments
  /api/v1/deployments/{id}/env/bulk:
    post:
      consumes:
      - application/json
      parameters:
      - description: Deployment ID
        in: path
        name: id
        required: true
        type: string
      - description: Bulk env payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_deployments.BulkEnvRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/skyport_internal_response.ErrorBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/skyport_internal_response.ErrorBody'
      security:
      - BearerAuth: []
      summary: Add env vars in bulk
      tags:
      - Deployments
  /api/v1/deployments/{id}/rollout:
    post:
      consumes:
      - application/json
      parameters:
      - description: Deployment ID
        in: path
        name: id
        required: true
        type: string
      - description: Rollout request
        in: body
        name: request
        schema:
          $ref: '#/definitions/internal_deployments.rolloutRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/skyport_internal_response.ErrorBody'
        "404":
